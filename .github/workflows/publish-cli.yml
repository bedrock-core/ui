name: Release CLI

# The CLI is released after its pinned packages and a Test CLI run are complete.
on:
  workflow_dispatch:
    inputs:
      test_run_id:
        description: Successful Test CLI workflow run ID for this commit
        required: true
        type: string

concurrency: cli-release-${{ github.ref }}

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish tested CLI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          path: ui
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@bedrock-core'

      - name: Configure temporary paths
        shell: bash
        run: |
          echo "BEDROCK_CLI_TARBALL=$RUNNER_TEMP/cli-candidate/bedrock-core-cli.tgz" >> "$GITHUB_ENV"
          echo "BEDROCK_CLI_SMOKE_SUMMARY=$RUNNER_TEMP/cli-candidate/cli-smoke-summary.json" >> "$GITHUB_ENV"

      - run: corepack enable

      - run: yarn install --immutable

      - name: Download tested CLI candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
        run: |
          conclusion=$(gh run view "$TEST_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          workflow=$(gh run view "$TEST_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)
          tested_sha=$(gh run view "$TEST_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          if [ "$conclusion" != "success" ]; then
            echo "Test CLI run $TEST_RUN_ID did not succeed."
            exit 1
          fi
          if [ "$workflow" != "Test CLI" ] || [ "$tested_sha" != "$GITHUB_SHA" ]; then
            echo "Run $TEST_RUN_ID is not a Test CLI run for this commit."
            exit 1
          fi
          gh run download "$TEST_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cli-release-candidate --dir "$RUNNER_TEMP/cli-candidate"
          if [ "$(cat "$RUNNER_TEMP/cli-candidate/cli-source-sha.txt")" != "$GITHUB_SHA" ]; then
            echo "The tested CLI candidate belongs to a different commit."
            exit 1
          fi

      - name: Check that nothing is pending
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v '/README\.md$' || true)
          if [ -n "$pending" ]; then
            echo "Unreleased changesets are pending; merge the Version PR before publishing:"
            echo "$pending"
            exit 1
          fi

      - name: Check CLI
        run: |
          yarn workspace @bedrock-core/cli lint
          yarn workspace @bedrock-core/cli build
          yarn workspace @bedrock-core/cli test
          yarn test:release

      - uses: changesets/action@v2
        with:
          cwd: ui
          publish-script: yarn release:cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
