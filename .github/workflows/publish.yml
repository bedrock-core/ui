name: Publish Release

# Manual, no-input release. Author changesets during development (`yarn changeset`);
# when you're ready, run this workflow on the branch you want to release from.
# It versions + publishes exactly the packages that changed, tags each one, and —
# when the @bedrock-core/ui meta package bumps — attaches the demo .mcpack.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Version, publish & tag changed packages
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # setup-node writes an .npmrc keyed on NODE_AUTH_TOKEN, not NPM_TOKEN — without
      # this every publish 401s. Yarn reads NPM_TOKEN, npm reads NODE_AUTH_TOKEN; set both.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── PREREQUISITE: @bedrock-core/server-runtime ────────────────────────────
      # `guides` + `config` depend on @bedrock-core/server-runtime, resolved
      # locally via `resolutions` → portal:../server-public. That package is NOT
      # yet on npm and the sibling repo is absent in CI, so `yarn install` below
      # FAILS until one of these is done:
      #   (1) Publish @bedrock-core/server-runtime (+ sync) to npm and drop the
      #       two portal: entries from the root package.json "resolutions".
      #   (2) Check out server-public alongside this repo. The portal is
      #       `../server-public` (a sibling ABOVE the workspace), so both repos
      #       must share a parent: change the checkout above to `path: ui`, add a
      #       second `actions/checkout` with `path: server-public`, and set
      #       `working-directory: ui` on every step below.
      # This workflow cannot go green until the blocker is resolved.

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
          scope: '@bedrock-core'

      - name: Install deps
        run: yarn install --immutable

      - name: Detect pending changesets
        id: detect
        run: |
          shopt -s nullglob
          pending=()
          for f in .changeset/*.md; do
            [[ "$(basename "$f")" == "README.md" ]] && continue
            pending+=("$f")
          done
          if [[ ${#pending[@]} -eq 0 ]]; then
            echo "No pending changesets — nothing to release."
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found ${#pending[@]} pending changeset(s)."
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture current meta version
        if: steps.detect.outputs.has == 'true'
        id: prev
        run: echo "ui=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Version packages
        if: steps.detect.outputs.has == 'true'
        run: yarn version-packages

      - name: Refresh lockfile
        if: steps.detect.outputs.has == 'true'
        run: yarn install --mode update-lockfile

      - name: Lint
        if: steps.detect.outputs.has == 'true'
        run: yarn lint

      - name: Build libraries
        if: steps.detect.outputs.has == 'true'
        run: yarn build:libs

      - name: Commit version bumps
        if: steps.detect.outputs.has == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages"

      - name: Publish sub-packages
        if: steps.detect.outputs.has == 'true'
        run: yarn changeset publish

      - name: Publish & tag meta package
        if: steps.detect.outputs.has == 'true'
        id: meta
        run: |
          NEXT=$(node -p "require('./package.json').version")
          echo "ui=$NEXT" >> "$GITHUB_OUTPUT"
          if [[ "$NEXT" != "${{ steps.prev.outputs.ui }}" ]]; then
            echo "Meta bumped ${{ steps.prev.outputs.ui }} → $NEXT — publishing."
            yarn workspace @bedrock-core/ui npm publish --tolerate-republish
            git tag "@bedrock-core/ui@$NEXT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Meta unchanged ($NEXT) — not publishing."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push commit & tags
        if: steps.detect.outputs.has == 'true'
        run: |
          git push
          git push --tags

      # ── .mcpack demo — only when the @bedrock-core/ui meta package was released ──
      - name: Set up Regolith
        if: steps.meta.outputs.bumped == 'true'
        uses: bedrock-core/setup-regolith@1.0.1
        with:
          regolith-version: '1.8.0'
          resolvers: |
            github.com/bedrock-core/regolith-filters

      - name: Install Regolith filters
        if: steps.meta.outputs.bumped == 'true'
        run: yarn regolith-install

      - name: Build resource pack
        if: steps.meta.outputs.bumped == 'true'
        run: yarn workspace @bedrock-core/ui-resource-pack build

      - name: Package Resource Pack (.mcpack)
        if: steps.meta.outputs.bumped == 'true'
        env:
          TAG: ${{ steps.meta.outputs.ui }}
        working-directory: packages/resource-pack/build/@bedrock-core_ui_rp
        run: zip -r "$GITHUB_WORKSPACE/core-ui-${TAG}.mcpack" .

      - name: Create @bedrock-core/ui GitHub Release
        if: steps.meta.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: '@bedrock-core/ui@${{ steps.meta.outputs.ui }}'
          name: '@bedrock-core/ui@${{ steps.meta.outputs.ui }}'
          generate_release_notes: true
          files: |
            core-ui-${{ steps.meta.outputs.ui }}.mcpack
