name: Release libraries

# Pushes maintain the Changesets version PR. Manual runs publish the UI npm
# libraries only. The render-pack artifact and CLI each have their own later
# workflow because both must consume the packages already released before them.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  version:
    name: Open or refresh the Version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          path: ui
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - run: yarn install --immutable

      - uses: changesets/action@v2
        with:
          cwd: ui
          version-script: yarn version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish UI libraries to npm
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          path: ui
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ui/yarn.lock
          registry-url: https://registry.npmjs.org
          scope: '@bedrock-core'

      - run: yarn install --immutable

      - name: Check that nothing is pending
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v '/README\.md$' || true)
          if [ -n "$pending" ]; then
            echo "Unreleased changesets are pending; merge the Version PR before publishing:"
            echo "$pending"
            exit 1
          fi

      - uses: changesets/action@v2
        with:
          cwd: ui
          publish-script: yarn release:libraries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
